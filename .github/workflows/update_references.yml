name: Update References

on:
  schedule:
    - cron: '0 2 * * *' # S'exécute tous les jours à 2h du matin
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  update-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          submodules: recursive # Assure le fetch des submodules (références)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exécuter le script de mise à jour des références
        run: |
          python references/update_references.py

      - name: Vérifier les modifications
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Créer une Pull Request si des mises à jour sont trouvées
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Automated Reference Update & Audit"
          branch: "chore/update-references"
          commit-message: "chore: update references submodules and report"
          body: |
            ## Rapport de mise à jour des références
            Les dépôts de références ont été mis à jour via `update_references.py`.
            
            ⚠️ **INSTRUCTIONS POUR L'AGENT IA (Lors du traitement de cette PR)** :
            - Veuillez analyser le rapport généré dans `references/update_report.md`.
            - Ajoutez les nouvelles fonctionnalités identifiées dans `feature_list.json` et `plan_usine_logicielle.md`.
            - **RÈGLE STRICTE : NE JAMAIS MODIFIER DES FEATURES OU DES ÉLÉMENTS DE PLAN DÉJÀ TERMINÉS (`completed` ou `[x]`).** Tout ajout doit se faire sous forme de nouveautés en attente (`pending` ou `[ ]`).
            - Consultez la procédure `references/PROCEDURE-UPDATE-REFERENCES.md` pour plus de détails.
