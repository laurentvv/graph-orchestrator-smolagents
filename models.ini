; ============================================================================
; models.ini — Preset du mode ROUTER de llama-server (migration Ollama → llama-server, F-58)
; ============================================================================
; Rôle : servir les 3 modèles du graphe via UN SEUL process llama-server en mode
; router (chargement à la demande + keep-alive, comportement "à la Ollama").
;
; Usage :
;   llama-server --models-preset ./models.ini --sleep-idle-seconds 300
;
; Les clients adressent chaque modèle via le champ "model" du body JSON, en
; utilisant le NOM de section ci-dessous (ex. "gemma-4-12b", "gemma-4-12b-nothink",
; "gemma-4-e4b").
;
; Thinking : piloté CÔTÉ SERVEUR via `reasoning = on/off` (validation F-58, voir
; debug/Gemma4_Thinking_Audit.md §4). Le client (DSPy/smolagents) NE passe PAS
; think=True (qui crashait sous Ollama, F-47) — il parle /v1 OpenAI-compatible et
; lit `content` (la réponse finale propre). Le thinking va dans `reasoning_content`
; (invisible pour DSPy = comportement voulu, la CoT est interne).
;
; Détails du format (voir debug/Gemma4_Thinking_Audit.md §7 et §8) :
;   - Clés = arguments CLI sans les "--" (ex. --n-gpu-layers  -> n-gpu-layers)
;   - Noms d'env LLAMA_ARG_* acceptés aussi
;   - [*]   = globals partagés par toutes les sections
;   - Pour un GGUF local, chaque section doit définir "model" (chemin absolu du blob).
; ============================================================================

version = 1

; --- Globals partagés par toutes les instances ----------------
[*]
c = 8192                      ; contexte
; n-gpu-layers : NON défini -> auto-fit (à la Ollama, évite OOM sur ~5 Go VRAM libres).
;   Si on veut forcer : n-gpu-layers = 32 (max stable sur cette config, audit §5).
no-mmap = true                ; recommandé Windows/CUDA (comme Ollama)
flash-attn = auto
np = 2                        ; 2 slots parallèles

; --- Modèle REASONING : gemma-4 12B QAT (thinking activé) ------------------
; Rôle dans le graphe : nœud Architect (le seul nœud think=True, F-47).
; VALIDÉ F-58 (GATE) : QAT + --reasoning on marche sur llama-server direct
; (reasoning_content rempli, content propre, pas de crash CUDA — contrairement au
; crash sous Ollama audit §2B). Résout le hang de 23 min du thinking forcé /v1 Ollama.
[gemma-4-12b]
model = D:\OLLAMA_MODELS\blobs\sha256-93567e57a8fe10b23569b9d9ec38cd005deedf71e29477c421a4b83f418a538b
reasoning = on                ; active le thinking (--reasoning on)
mmproj = D:\OLLAMA_MODELS\blobs\sha256-cb018338a7538a9814d994bfe54644c71eb7ed54e31eae2f721e45fd3c260da7
c = 8192

; --- Modèle REASONING NO-THINK : gemma-4 12B QAT (sans thinking, +rapide) --
; Rôle dans le graphe : Judge / Security / PromptRefiner / Escalation (nœuds
; think=False, F-47). Même modèle costaud que l'Architect MAIS sans thinking → plus
; rapide (pas de budget gaspillé en raisonnement sur des tâches de verdict/classification).
; Router : utilise le fast_model (gemma-4-e4b) ci-dessous.
[gemma-4-12b-nothink]
model = D:\OLLAMA_MODELS\blobs\sha256-93567e57a8fe10b23569b9d9ec38cd005deedf71e29477c421a4b83f418a538b
reasoning = off               ; pas de thinking (tâches de verdict, gaspi sinon)
mmproj = D:\OLLAMA_MODELS\blobs\sha256-cb018338a7538a9814d994bfe54644c71eb7ed54e31eae2f721e45fd3c260da7
c = 8192

; --- Modèle FAST : gemma-4 E4B QAT (zéro-shot) ----------------------------
; Rôle dans le graphe : Coder / Router (génération + classification rapide, sans réflexion).
[gemma-4-e4b]
model = D:\OLLAMA_MODELS\blobs\sha256-df0fd4ee07072c607c29a0a1cb4f98918426cca12f45a2776bdd6ee6d09a4de3
reasoning = off               ; pas de thinking pour rester rapide
mmproj = D:\OLLAMA_MODELS\blobs\sha256-7c9bafa27f82d658eda805c1d82ef62bb0368e1ff75f64f77de58ad318beaaf9
c = 8192
