[project]
name = "graph-orchestrator-smolagents"
version = "0.5.0"
description = "Architecture de Graph Engineering (Fan-out -> Judge -> Synthesize) pour agents IA avec smolagents et asyncio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.0",
    "dspy-ai>=3.2.1",
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "libcst>=1.9.0",
    "markdownify>=1.0",
    "mcp>=1.10.1,<2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "smolagents[mcp,openai]>=1.26.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_orchestrator", "agent_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
extend-ignore = ['E402']
