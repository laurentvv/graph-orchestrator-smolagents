[project]
name = "graph-orchestrator-smolagents"
version = "0.2.0"
description = "Architecture de Graph Engineering (Fan-out -> Judge -> Synthesize) pour agents IA avec smolagents et asyncio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "smolagents[openai]>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
