[project]
name = "graph-orchestrator-smolagents"
version = "0.5.0"
description = "Architecture de Graph Engineering (Fan-out -> Judge -> Synthesize) pour agents IA avec smolagents et asyncio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.0",
    "dspy-ai>=3.2.1",
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "markdownify>=1.0",
    "mcp>=1.10.1,<2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "smolagents[mcp,openai]>=1.26.0",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_orchestrator", "agent_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
